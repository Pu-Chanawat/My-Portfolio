<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="256" height="256"
     shape-rendering="crispEdges" role="img" aria-label="Pixel-art profile placeholder">
  <!-- backdrop -->
  <rect width="16" height="16" fill="#006b6b"/>
  <rect x="0" y="0" width="16" height="1" fill="#008080"/>
  <rect x="0" y="15" width="16" height="1" fill="#005757"/>

  <!-- hair -->
  <rect x="4" y="1"  width="8" height="2" fill="#2f2a26"/>
  <rect x="3" y="2"  width="1" height="6" fill="#2f2a26"/>
  <rect x="12" y="2" width="1" height="6" fill="#2f2a26"/>

  <!-- face -->
  <rect x="4" y="3" width="8" height="5" fill="#f2c9a4"/>
  <rect x="4" y="8" width="8" height="1" fill="#e0b48c"/>

  <!-- eyes -->
  <rect x="5" y="5" width="2" height="2" fill="#1b1b1b"/>
  <rect x="9" y="5" width="2" height="2" fill="#1b1b1b"/>
  <rect x="6" y="5" width="1" height="1" fill="#ffffff"/>
  <rect x="10" y="5" width="1" height="1" fill="#ffffff"/>

  <!-- smile -->
  <rect x="6" y="7" width="1" height="1" fill="#c9836f"/>
  <rect x="9" y="7" width="1" height="1" fill="#c9836f"/>
  <rect x="7" y="8" width="2" height="1" fill="#c9836f"/>

  <!-- neck -->
  <rect x="6" y="9" width="4" height="2" fill="#e0b48c"/>

  <!-- shirt -->
  <rect x="2"  y="11" width="12" height="5" fill="#1e3a8a"/>
  <rect x="2"  y="11" width="12" height="1" fill="#2b4fb8"/>
  <rect x="7"  y="11" width="2"  height="1" fill="#f2c9a4"/>
  <rect x="6"  y="11" width="1"  height="2" fill="#f2c9a4"/>
  <rect x="9"  y="11" width="1"  height="2" fill="#f2c9a4"/>
</svg>
